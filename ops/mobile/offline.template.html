<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TuriMath</title>
<style>
  :root { --bg: #1a1d21; --text: #d1d2d3; --muted: #9a9b9d; --accent: #007a5a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; gap: 12px; }
  h1 { margin: 0; font-size: 22px; } p { margin: 0; color: var(--muted); max-width: 320px; }
  button { margin-top: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 24px; font: inherit; font-weight: 700; }
</style></head>
<body><main>
  <h1>Can't reach the office</h1>
  <p>The chat lives on the TuriMath VM. Make sure Tailscale is connected on this phone, then try again.</p>
  <button onclick="location.href='__CHAT_URL__'">Try again</button>
</main></body></html>
